<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teachable Machine Local Test</title>
</head>
<body>
    <div>Teachable Machine Image Model</div>
    <button type="button" id="start-button" onclick="init()">Start</button>
    <div id="status-container"></div>
    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <!-- Pinned versions: the Teachable Machine image library is built against
         TF.js 1.x. Newer @latest tfjs versions break model loading. -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        // Model files sit in the same folder as this page
        const URL = "./";

        let model, webcam, labelContainer, maxPredictions;

        function setStatus(text) {
            document.getElementById("status-container").innerText = text;
        }

        async function init() {
            const button = document.getElementById("start-button");
            button.disabled = true;
            setStatus("Loading model...");

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                // Load the model and metadata
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                setStatus("Requesting camera access...");

                // Setup webcam (needs HTTPS or localhost)
                const flip = true;
                webcam = new tmImage.Webcam(200, 200, flip);
                await webcam.setup();
                await webcam.play();
                window.requestAnimationFrame(loop);

                // Append elements to DOM
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("label-container");
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
                setStatus("");
            } catch (err) {
                console.error(err);
                setStatus("Error: " + err.message +
                    " — serve this folder over http:// (e.g. `python3 -m http.server`) and allow webcam access.");
                button.disabled = false;
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>
</body>
</html>
