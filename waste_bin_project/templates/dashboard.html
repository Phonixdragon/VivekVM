<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shadow Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* Liquid Glass Background Effect */
        .liquid-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .liquid-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            animation: float 8s ease-in-out infinite;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.3);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: rgba(102, 126, 234, 0.4);
            bottom: 10%;
            right: 10%;
            animation-delay: 2s;
        }

        .blob-3 {
            width: 250px;
            height: 250px;
            background: rgba(118, 75, 162, 0.5);
            top: 50%;
            left: 50%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Navigation */
        nav {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        }

        .nav-brand {
            color: #fff;
            font-size: 1.5em;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 
                0 8px 32px 0 rgba(31, 38, 135, 0.37),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            margin-bottom: 40px;
        }

        .welcome-card h1 {
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .welcome-card p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        /* Points Display */
        .points-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .points-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 
                0 8px 32px 0 rgba(31, 38, 135, 0.37),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            transition: all 0.3s ease;
        }

        .points-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 15px 40px 0 rgba(31, 38, 135, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .points-icon {
            font-size: 4em;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
        }

        .points-value {
            color: #fff;
            font-size: 4em;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .points-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.3em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Action Button */
        .action-btn {
            padding: 20px 50px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));
            color: #fff;
            font-size: 1.3em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.2));
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .action-btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Animation Overlay */
        .animation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .animation-content {
            text-align: center;
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .points-animation {
            font-size: 8em;
            font-weight: 700;
            color: #4CAF50;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.8);
            animation: pointsPulse 0.5s ease-out;
        }

        @keyframes pointsPulse {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .stars-container {
            margin-top: 30px;
            font-size: 3em;
        }

        .star {
            display: inline-block;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: starTwinkle 0.3s ease-out;
            opacity: 0;
        }

        @keyframes starTwinkle {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f00;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .message-text {
            color: #fff;
            font-size: 2em;
            margin-top: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .welcome-card {
                padding: 30px 20px;
            }

            .welcome-card h1 {
                font-size: 2em;
            }

            .points-value {
                font-size: 3em;
            }

            .action-btn {
                padding: 15px 30px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <!-- Liquid Background -->
    <div class="liquid-bg">
        <div class="liquid-blob blob-1"></div>
        <div class="liquid-blob blob-2"></div>
        <div class="liquid-blob blob-3"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="nav-brand">♻️ SHADOW NETWORK</div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="welcome-card">
            <h1>Welcome, {{ username }}!</h1>
            <p>Admin: Vivek VM | Shadow Network Team</p>
        </div>

        <div class="points-section">
            <div class="points-card">
                <div class="points-icon">🏆</div>
                <div class="points-value" id="currentPoints">{{ points }}</div>
                <div class="points-label">Total Points</div>
            </div>
        </div>

        <div style="text-align: center;">
            <button class="action-btn" id="earnPointsBtn" onclick="earnPoints()">
                ♻️ Recycle & Earn 5 Points
            </button>
        </div>
    </div>

    <!-- Animation Overlay -->
    <div class="animation-overlay" id="animationOverlay">
        <div class="animation-content">
            <div class="points-animation">+5 POINTS!</div>
            <div class="stars-container" id="starsContainer"></div>
            <div class="message-text">Congratulations!</div>
        </div>
    </div>

    <script>
        let isAnimating = false;

        function earnPoints() {
            if (isAnimating) return;
            
            isAnimating = true;
            const btn = document.getElementById('earnPointsBtn');
            btn.disabled = true;

            fetch('/add_points', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showAnimation(data.new_points);
                    } else {
                        alert(data.message);
                        isAnimating = false;
                        btn.disabled = false;
                    }
                })
                .catch(error => {
                    alert('An error occurred. Please try again.');
                    isAnimating = false;
                    btn.disabled = false;
                });
        }

        function showAnimation(newPoints) {
            const overlay = document.getElementById('animationOverlay');
            const starsContainer = document.getElementById('starsContainer');
            
            // Show overlay
            overlay.style.display = 'flex';
            
            // Create stars with staggered animation
            starsContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = '⭐';
                star.style.animationDelay = `${i * 0.1}s`;
                starsContainer.appendChild(star);
            }

            // Create confetti
            createConfetti();

            // Update points after animation
            setTimeout(() => {
                document.getElementById('currentPoints').textContent = newPoints;
            }, 500);

            // Hide overlay after 3 seconds
            setTimeout(() => {
                overlay.style.display = 'none';
                isAnimating = false;
                document.getElementById('earnPointsBtn').disabled = false;
            }, 3000);
        }

        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#ffc0cb'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.querySelector('.animation-overlay').appendChild(confetti);
                    
                    // Remove confetti after animation
                    setTimeout(() => {
                        confetti.remove();
                    }, 4000);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
